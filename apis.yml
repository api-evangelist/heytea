name: Heytea
description: 'Heytea is a Chinese premium modern tea-beverage chain founded in 2012 in Jiangmen, Guangdong.
  It pioneered cheese-topped tea and fresh-fruit "new-style tea" and has grown to thousands of stores across
  mainland China and international markets including Singapore, the United Kingdom, Australia, Canada and the
  United States. Backed by investors including Hongshan (formerly Sequoia Capital China) and IDG Capital, Heytea
  runs its own mobile ordering app and retail loyalty program. As a consumer food-and-beverage retailer it
  publishes no public developer API, documentation portal, or SDKs; this profile is retained in the network as
  a company identity lead.'
